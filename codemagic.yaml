workflows:

  # ============================================
  # ANDROID - gera o APK (teste) e o AAB (loja)
  # ============================================
  android-boraler:
    name: Boraler - Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      vars:
        PACKAGE_NAME: "com.boraler.app"
    scripts:
      - name: Instalar dependências
        script: npm install

      - name: Adicionar plataforma Android (se ainda não existir)
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Criar ícone da notificação
        script: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_boraler.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:fillType="evenOdd"
                android:pathData="M12,6 C10.5,4.9 8.5,4.5 6,4.5 C4.8,4.5 3.8,4.6 3,4.9 L3,18.9 C3.8,18.6 4.8,18.5 6,18.5 C8.5,18.5 10.5,18.9 12,20 C13.5,18.9 15.5,18.5 18,18.5 C19.2,18.5 20.2,18.6 21,18.9 L21,4.9 C20.2,4.6 19.2,4.5 18,4.5 C15.5,4.5 13.5,4.9 12,6 Z M11.4,7 L12.6,7 L12.6,19 L11.4,19 Z" />
          </vector>
          EOF

      - name: Sincronizar arquivos com o Android
        script: npx cap sync android

      - name: Gerar APK de teste (não assinado)
        script: |
          cd android
          ./gradlew assembleDebug

      - name: Gerar AAB para a Play Store
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - seu-email@exemplo.com

  # ============================================
  # iOS - gera o .ipa
  # Precisa de conta Apple Developer configurada
  # dentro do painel do Codemagic (Teams > Code
  # signing identities), pois o Xcode exige
  # certificado + perfil de provisionamento.
  # ============================================
  ios-boraler:
    name: Boraler - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.boraler.app
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Instalar dependências
        script: npm install

      - name: Adicionar plataforma iOS (se ainda não existir)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sincronizar arquivos com o iOS
        script: npx cap sync ios

      - name: Instalar CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Configurar assinatura automática
        script: xcode-project use-profiles

      - name: Gerar o build (.ipa)
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - seu-email@exemplo.com
