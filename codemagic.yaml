workflows:

  # ============================================
  # ANDROID - gera o APK (teste) e o AAB (loja)
  # ============================================
  android-boraler:
    name: Boraler - Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      vars:
        PACKAGE_NAME: "com.boraler.app"
    scripts:
      - name: Instalar dependências
        script: npm install

      - name: Adicionar plataforma Android (se ainda não existir)
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sincronizar arquivos com o Android
        script: npx cap sync android

      - name: Gerar APK de teste (não assinado)
        script: |
          cd android
          ./gradlew assembleDebug

      - name: Gerar AAB para a Play Store
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - seu-email@exemplo.com

  # ============================================
  # iOS - gera o .ipa
  # Precisa de conta Apple Developer configurada
  # dentro do painel do Codemagic (Teams > Code
  # signing identities), pois o Xcode exige
  # certificado + perfil de provisionamento.
  # ============================================
  ios-boraler:
    name: Boraler - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.boraler.app
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Instalar dependências
        script: npm install

      - name: Adicionar plataforma iOS (se ainda não existir)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sincronizar arquivos com o iOS
        script: npx cap sync ios

      - name: Instalar CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Configurar assinatura automática
        script: xcode-project use-profiles

      - name: Gerar o build (.ipa)
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - seu-email@exemplo.com
